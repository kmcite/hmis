analyzer:
  errors:
    deprecated_member_use: ignore
    unused_element: ignore
    unused_element_parameter: ignore
  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**
    # Legacy / ghost paths (pre refactor — not part of canonical lib/)
    - lib/business/presentation/**
    - lib/cubits/**
    - lib/controllers/**
    - lib/features/**
    # lib/data — thin legacy export barrels only (on disk)
    # lib/models — thin legacy export barrels only (on disk)
    # lib/repositories — thin legacy export barrels only (on disk)
    - lib/sync/**
    # lib/di — thin legacy export barrels only (on disk)
    - lib/liquid/**
    - lib/utils/liquid/**
    # lib/utils/ids.dart — legacy export barrel (on disk)
    - lib/utils/router.dart
    - lib/domain/data/**
    - lib/domain/sync/**
    - lib/domain/time/**
    - lib/domain/repository/**
    # lib/ui/screens — thin legacy export barrels only (on disk)
    - lib/ui/dialogs/**
    - lib/ui/er_case_register/**
    - lib/ui/chit/**
    - lib/ui/pocketbase_gate/**
    - lib/ui/shell/**
    - lib/ui/theme/**
    - lib/ui/widgets/**
    - lib/ui/liquid/**
    - lib/ui/marksheet/datebar.dart
    - lib/ui/marksheet/er_marksheet_grid.dart
formatter:
  trailing_commas: preserve
