analyzer:
  errors:
    deprecated_member_use: ignore
    unused_element: ignore
    unused_element_parameter: ignore
  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**
    # Legacy / ghost paths (pre refactor — not part of canonical lib/)
    - lib/business/presentation/**
    - lib/cubits/**
    - lib/controllers/**
    - lib/features/**
    - lib/data/**
    - lib/models/**
    - lib/repositories/**
    - lib/sync/**
    - lib/di/**
    - lib/liquid/**
    - lib/utils/liquid/**
    - lib/utils/ids.dart
    - lib/utils/router.dart
    - lib/domain/data/**
    - lib/domain/sync/**
    - lib/domain/time/**
    - lib/domain/repository/**
    - lib/ui/screens/**
    - lib/ui/dialogs/**
    - lib/ui/er_case_register/**
    - lib/ui/chit/**
    - lib/ui/pocketbase_gate/**
    - lib/ui/shell/**
    - lib/ui/theme/**
    - lib/ui/widgets/**
    - lib/ui/liquid/**
    # Widgets copied to ui/home/ or ui/marksheet/ root (canonical: */components/)
    - lib/ui/home/home_case_type_breakdown.dart
    - lib/ui/home/home_quick_actions.dart
    - lib/ui/home/home_recent_patients.dart
    - lib/ui/home/home_today_dashboard.dart
    - lib/ui/home/home_context_header.dart
    - lib/ui/home/home_shift_utils.dart
    - lib/ui/marksheet/datebar.dart
    - lib/ui/marksheet/er_marksheet_grid.dart
formatter:
  trailing_commas: preserve
