analyzer:
  errors:
    deprecated_member_use: ignore
    unused_element: ignore
    unused_element_parameter: ignore
  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**
    # Legacy / ghost paths (pre refactor — not part of canonical lib/)
    - lib/business/presentation/**
    - lib/cubits/**
    - lib/controllers/**
    - lib/features/**
    - lib/data/**
    - lib/models/**
    - lib/repositories/**
    - lib/sync/**
    - lib/di/**
    - lib/liquid/**
    - lib/utils/liquid/**
    - lib/utils/ids.dart
    - lib/utils/router.dart
    - lib/domain/data/**
    - lib/domain/sync/**
    - lib/domain/time/**
    - lib/domain/repository/**
    - lib/ui/screens/**
    - lib/ui/dialogs/**
    - lib/ui/er_case_register/**
    - lib/ui/chit/**
    - lib/ui/pocketbase_gate/**
    - lib/ui/shell/**
    - lib/ui/theme/**
    - lib/ui/widgets/**
    - lib/ui/liquid/**
formatter:
  trailing_commas: preserve
