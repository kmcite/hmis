name: hmis
description: A new Flutter project.
publish_to: "none"
version: 0.1.11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  pocketbase: ^0.25.0
  objectbox: ^6.0.0-preview.3
  objectbox_flutter_libs: ^6.0.0-preview.3

dev_dependencies:
  build_runner: ^2.16.1
  objectbox_generator: ^6.0.0-preview.3
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.jpg
  adaptive_icon_background: "#0D6E6E"
  adaptive_icon_foreground: assets/branding/app_icon.jpg
  web:
    generate: true
  windows:
    generate: true

flutter_native_splash:
  color: "#DFF5F4"
  color_dark: "#061818"
  image: assets/branding/app_icon.jpg
  android_12:
    color: "#DFF5F4"
    color_dark: "#061818"
    image: assets/branding/app_icon.jpg
  web: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
