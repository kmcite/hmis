name: hmis
description: A new Flutter project.
publish_to: "none"
version: 0.1.11

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  shared_database:
    path: C://Users//Adn//Desktop//next_generation//shared_database

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.jpg
  adaptive_icon_background: "#6D28D9"
  adaptive_icon_foreground: assets/branding/app_icon.jpg
  web:
    generate: true
  windows:
    generate: true

flutter_native_splash:
  color: "#DFF5F4"
  color_dark: "#061818"
  image: assets/branding/app_icon.jpg
  android_12:
    color: "#DFF5F4"
    color_dark: "#061818"
    image: assets/branding/app_icon.jpg
  web: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
